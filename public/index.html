<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMBS — Land Management Blockchain System</title>

    <!-- Favicons & app icons (Stitch Immutable Governance branding) -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.svg" />
    <link rel="mask-icon" href="%PUBLIC_URL%/favicon.svg" color="#0F172A" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="application-name" content="LMBS" />
    <meta name="description" content="Land Management Blockchain System - Kingdom of Lesotho" />

    <!-- Public Sans (Stitch Immutable Governance design system) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined (icons used throughout the Stitch screens) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN with the Stitch token map (Material 3-flavoured) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // Stitch "Immutable Governance" palette
              "surface": "#f7f9fb",
              "surface-dim": "#d8dadc",
              "surface-bright": "#f7f9fb",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f2f4f6",
              "surface-container": "#eceef0",
              "surface-container-high": "#e6e8ea",
              "surface-container-highest": "#e0e3e5",
              "on-surface": "#191c1e",
              "on-surface-variant": "#45464d",
              "inverse-surface": "#2d3133",
              "inverse-on-surface": "#eff1f3",
              "outline": "#76777d",
              "outline-variant": "#c6c6cd",
              "surface-tint": "#565e74",
              "primary": "#000000",
              "on-primary": "#ffffff",
              "primary-container": "#131b2e",
              "on-primary-container": "#7c839b",
              "inverse-primary": "#bec6e0",
              "secondary": "#515f74",
              "on-secondary": "#ffffff",
              "secondary-container": "#d5e3fc",
              "on-secondary-container": "#57657a",
              "tertiary": "#000000",
              "on-tertiary": "#ffffff",
              "tertiary-container": "#002114",
              "on-tertiary-container": "#069669",
              "error": "#ba1a1a",
              "on-error": "#ffffff",
              "error-container": "#ffdad6",
              "on-error-container": "#93000a",
              "primary-fixed": "#dae2fd",
              "primary-fixed-dim": "#bec6e0",
              "on-primary-fixed": "#131b2e",
              "on-primary-fixed-variant": "#3f465c",
              "secondary-fixed": "#d5e3fc",
              "secondary-fixed-dim": "#b9c7df",
              "on-secondary-fixed": "#0d1c2e",
              "on-secondary-fixed-variant": "#3a485b",
              "tertiary-fixed": "#85f8c4",
              "tertiary-fixed-dim": "#68dba9",
              "on-tertiary-fixed": "#002114",
              "on-tertiary-fixed-variant": "#005137",
              "background": "#f7f9fb",
              "on-background": "#191c1e",
              "surface-variant": "#e0e3e5"
            },
            fontFamily: {
              "public-sans": ["Public Sans", "ui-sans-serif", "system-ui", "sans-serif"],
              "mono-tabular": ["ui-monospace", "SFMono-Regular", "Menlo", "monospace"]
            },
            fontSize: {
              "h1":          ["48px", { lineHeight: "1.2", letterSpacing: "-0.02em" }],
              "h2":          ["30px", { lineHeight: "1.3", letterSpacing: "-0.01em" }],
              "h3":          ["24px", { lineHeight: "1.3" }],
              "body-lg":     ["18px", { lineHeight: "1.6" }],
              "body-md":     ["16px", { lineHeight: "1.5" }],
              "body-sm":     ["14px", { lineHeight: "1.4" }],
              "label-caps":  ["12px", { lineHeight: "1.2", letterSpacing: "0.05em" }],
              "data-tabular":["14px", { lineHeight: "1.0" }]
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem"
            },
            spacing: {
              "stack-sm": "8px",
              "stack-md": "16px",
              "stack-lg": "32px",
              "gutter": "24px",
              "margin": "32px",
              "container-max": "1440px"
            }
          }
        }
      };
    </script>

    <style>
      body {
        margin: 0;
        font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
        background: #f7f9fb;
        color: #191c1e;
      }
      body::-webkit-scrollbar { width: 8px; }
      body::-webkit-scrollbar-track { background: #f2f4f6; }
      body::-webkit-scrollbar-thumb { background: #c6c6cd; border-radius: 4px; }
      body::-webkit-scrollbar-thumb:hover { background: #76777d; }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }

      /* Initial loader - shown before React hydrates. React's first render
         replaces #root's children, so this disappears automatically. */
      .lmbs-boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px;
        background: #f7f9fb;
        font-family: "Public Sans", system-ui, sans-serif;
        color: #45464d;
      }
      .lmbs-boot-ring {
        width: 56px; height: 56px;
        border-radius: 50%;
        border: 4px solid #e0e3e5;
        border-top-color: #0F172A;
        border-right-color: #059669;
        animation: lmbs-spin 0.9s linear infinite;
      }
      .lmbs-boot-label {
        font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 700;
        color: #76777d;
      }
      .lmbs-boot-brand {
        font-size: 18px; font-weight: 700; color: #0F172A; letter-spacing: -0.01em;
      }
      @keyframes lmbs-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .lmbs-boot-ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="lmbs-boot" role="status" aria-live="polite" aria-label="Loading LMBS">
        <div class="lmbs-boot-ring" aria-hidden="true"></div>
        <div class="lmbs-boot-brand">LMBS</div>
        <div class="lmbs-boot-label">Loading registry...</div>
      </div>
    </div>
    <noscript>
      <div style="padding:24px;font-family:system-ui,sans-serif;color:#0F172A;">
        LMBS requires JavaScript. Please enable it to continue.
      </div>
    </noscript>
  </body>
</html>
