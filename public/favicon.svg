<?xml version="1.0" encoding="UTF-8"?>
<!--
  LMBS favicon - Land-pin glyph in the Stitch Immutable Governance palette.
  Deep navy (#0F172A) anchor with emerald (#059669) parcel boundary.
  SVG so it stays crisp at every density and colours can flip via prefers-color-scheme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LMBS">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Rounded square base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>

  <!-- Cadastral parcel outline -->
  <path d="M14 22 L34 16 L50 28 L46 46 L20 50 L14 36 Z"
        fill="none" stroke="#34d399" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Vertex pins -->
  <circle cx="14" cy="22" r="2.4" fill="#34d399"/>
  <circle cx="34" cy="16" r="2.4" fill="#34d399"/>
  <circle cx="50" cy="28" r="2.4" fill="#34d399"/>
  <circle cx="46" cy="46" r="2.4" fill="#34d399"/>
  <circle cx="20" cy="50" r="2.4" fill="#34d399"/>
  <circle cx="14" cy="36" r="2.4" fill="#34d399"/>

  <!-- Verified check at the centre -->
  <circle cx="32" cy="33" r="9" fill="#059669"/>
  <path d="M27 33 L31 37 L38 30" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
